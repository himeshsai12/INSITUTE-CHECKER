[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
# Adapted from the bundled Nord theme: midnight surfaces and spectral accents.
base = "dark"
primaryColor = "#4F46E5"
backgroundColor = "#080F1E"
secondaryBackgroundColor = "#111E33"
textColor = "#E6EFFB"
linkColor = "#67E8F9"
linkUnderline = false
borderColor = "#293C58"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "8px"
font = "'Segoe UI', sans-serif"
headingFont = "'Bahnschrift', 'Segoe UI', sans-serif"
codeFont = "'Cascadia Code', monospace"
codeBackgroundColor = "#0B1426"
codeTextColor = "#A5E8F3"
baseFontSize = 14
headingFontSizes = ["36px", "27px", "21px", "18px", "16px", "14px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#67E8F9", "#A78BFA", "#60A5FA", "#FBBF24", "#34D399", "#F472B6"]
dataframeBorderColor = "#293C58"
dataframeHeaderBackgroundColor = "#14243C"
blueColor = "#60A5FA"
blueTextColor = "#93C5FD"
greenColor = "#34D399"
greenTextColor = "#6EE7B7"
orangeColor = "#FB923C"
orangeTextColor = "#FDBA74"
yellowColor = "#FBBF24"
violetColor = "#A78BFA"
violetTextColor = "#C4B5FD"
redColor = "#F87171"
redTextColor = "#FCA5A5"
grayColor = "#94A3B8"
grayTextColor = "#B6C6DA"

[theme.sidebar]
backgroundColor = "#070C17"
secondaryBackgroundColor = "#13213A"
codeBackgroundColor = "#0B1426"
textColor = "#DCE8F8"
primaryColor = "#4F46E5"
linkColor = "#67E8F9"
borderColor = "#24344F"
